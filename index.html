<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Signup</title>
  </head>
  <body>
    <form action="" method="get">
      <div class="banner"></div>
      <div class="welcome-text">
        Sign up to start sharing your favorite teams today!
      </div>
      <div class="txt-input">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" />
      </div>
      <div class="txt-input">
        <label for="pwdInitial">Password</label
        ><input type="password" name="pwdInitial" id="pwdInitial" />
      </div>
      <div class="txt-input">
        <label for="pwdConfirm">Confirm Password</label
        ><input type="password" name="pwdConfirm" id="pwdConfirm" />
      </div>
      <div>
        <button type="submit">Sign up</button>
      </div>
      <div class="form-footer-text">
        <hr />
        <div>or sign in with</div>
        <hr />
      </div>
      <div class="form-footer-auth">
        <div class="alternate-signin"></div>
        <div class="alternate-signin"></div>
        <div class="alternate-signin"></div>
      </div>
    </form>
  </body>
</html>
